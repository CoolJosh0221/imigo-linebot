name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --extra dev
      - name: Run regression tests
        run: uv run --frozen --extra dev python -m pytest -q
      - name: Validate Cloudflare routing with the pinned connector
        run: uv run --frozen --extra dev python -m scripts.check_tunnel_config
