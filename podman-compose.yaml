services:
  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: migrant-worker-bot
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET}
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN}
      - LLM_BASE_URL=http://llm:8001/v1
      - MODEL_NAME=${MODEL_NAME:-aisingapore/Qwen-SEA-LION-v4-32B-IT-4BIT}
      - DATABASE_URL=sqlite+aiosqlite:////data/database.db
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
    volumes:
      - ./data:/data
    depends_on:
      - llm
    restart: unless-stopped
    networks:
      - bot-network

  # vLLM server; uses the same model settings as Docker.
  llm:
    image: vllm/vllm-openai:latest
    container_name: sealion-llm
    command:
      - "--model"
      - "${MODEL_PATH:-${MODEL_NAME:-aisingapore/Qwen-SEA-LION-v4-32B-IT-4BIT}}"
      - "--served-model-name"
      - "${MODEL_NAME:-aisingapore/Qwen-SEA-LION-v4-32B-IT-4BIT}"
      - "--dtype"
      - "float16"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-8192}"
      - "--gpu-memory-utilization"
      - "0.93"
      - "--enforce-eager"
      - "--port"
      - "8001"
    ports:
      - "8001:8001"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      # Cache Hugging Face models to avoid re-downloading
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - bot-network
    # Increase shared memory for PyTorch
    shm_size: 8gb

networks:
  bot-network:
    driver: bridge

volumes:
  data:
  models:
